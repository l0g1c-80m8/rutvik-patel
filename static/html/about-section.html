<section id="about">
  <div class="section-wrap">

    <div class="section-header">
      <div>
        <span class="index">§ 02 / 07</span>
        &nbsp;&mdash;&nbsp;
        <span class="title">ABOUT</span>
      </div>
      <div>$ whoami</div>
    </div>

    <!-- profile prose -->
    <div class="tlm-subhead">
      <span class="path">~/about</span>
      <span>$</span>
      <span class="cmd">cat profile</span>
    </div>
    <div class="tlm-about-prose">
      <p>${about_lead}</p>
      <p>${about_conclude}</p>
    </div>

    <!-- skill stack -->
    <div class="tlm-subhead">
      <span class="path">~/about</span>
      <span>$</span>
      <span class="cmd">ls stack</span>
    </div>
    <div class="tlm-about-stack">
      <% _.each(skills, function(skill) { %>
        <span class="tlm-tag"><%= skill %></span>
      <% }); %>
    </div>

    <!-- credentials table -->
    <div class="tlm-subhead">
      <span class="path">~/about</span>
      <span>$</span>
      <span class="cmd">cat credentials</span>
    </div>
    <div class="tlm-about-credentials">
      <div class="tlm-cred-row">
        <span class="tlm-cred-label">edu</span>
        <span class="tlm-cred-value">${education}</span>
      </div>
      <div class="tlm-cred-row">
        <span class="tlm-cred-label">xp</span>
        <span class="tlm-cred-value">${experience}</span>
      </div>
      <div class="tlm-cred-row">
        <span class="tlm-cred-label">r&amp;d</span>
        <span class="tlm-cred-value">${research}</span>
      </div>
    </div>

  </div>
</section>
