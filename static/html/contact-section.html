<section id="contact">
  <div class="section-wrap">

    <div class="section-header">
      <div>
        <span class="index">§ 07 / 07</span>
        &nbsp;&mdash;&nbsp;
        <span class="title">CONTACT</span>
      </div>
      <div>INBOX · OPEN</div>
    </div>

    <!-- Channels list — pulled from data.contacts -->
    <div class="tlm-contact-channels" id="contact-links"></div>

    <!-- Terminal-style message form -->
    <div class="tlm-form-wrap">
      <div class="tlm-form-prompt">
        <span class="path">~/rutvik-patel</span>
        <span>$</span>
        <span class="cmd">contact --new</span>
      </div>

      <form id="contact-form" class="tlm-form" novalidate>
        <div class="tlm-form-field">
          <label for="name">&gt; name</label>
          <input type="text" id="name" name="name" required autocomplete="name" />
        </div>

        <div class="tlm-form-field">
          <label for="email">&gt; email</label>
          <input type="email" id="email" name="email" required autocomplete="email" inputmode="email" />
        </div>

        <div class="tlm-form-field">
          <label for="subject">&gt; subject</label>
          <input type="text" id="subject" name="subject" required autocomplete="off" />
        </div>

        <div class="tlm-form-field">
          <label for="message">&gt; message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <div class="tlm-form-actions">
          <button type="submit" id="form-submit-btn" class="tlm-form-submit">↗ send</button>
          <p id="form-success-msg" class="tlm-form-status hidden"></p>
        </div>
      </form>
    </div>

  </div>
</section>
