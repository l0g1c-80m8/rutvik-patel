<nav class="tlm-nav" data-tlm-nav>
  <div class="tlm-nav-row">
    <a href="#home" class="tlm-nav-brand">
      <span class="node-id"><%= brand.node %></span>
      <span><%= brand.name %></span>
    </a>

    <div class="tlm-nav-links">
      <% _.each(links, function(l) { %>
        <a href="#<%= l.section %>" data-section="<%= l.section %>"><%= l.label %></a>
      <% }); %>
    </div>

    <div class="status-pip" aria-label="status indicator">
      <span class="dot"></span>
      <span><%= status %></span>
    </div>

    <button class="tlm-nav-burger" id="mobile-menu-btn" aria-label="menu">MENU</button>
  </div>

  <div class="tlm-mobile-menu" id="mobile-menu">
    <% _.each(links, function(l) { %>
      <a href="#<%= l.section %>"><%= l.label %></a>
    <% }); %>
  </div>
</nav>
